[tool.poetry]
name = "greadme"
version = "0.1.3"
description = "Generate README files using AI"
authors = ["Vinicius de Freitas Paulino <vinifreitaspaulino@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/vinifreitaspaulino/readme-generator"
documentation = "https://github.com/vinifreitaspaulino/readme-generator#readme"
homepage = "https://pypi.org/project/greadme"
keywords = ["readme", "ai", "generator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
google-genai = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
mypy = "^1.0.0"

[tool.poetry.scripts]
greadme = "greadme.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"